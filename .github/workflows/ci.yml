name: CI/CD Practica Profesional ms-maestriacomputacion-front-sin-lineamientos

on:
  push:
    branches: ['despliegue-de-pruebas']

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Login Dockerhub
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t $DOCKER_USERNAME/practica-profesional-frontend-sin-lineamientos:latest .
          docker push $DOCKER_USERNAME/practica-profesional-frontend-sin-lineamientos:latest

  deploy:
    runs-on: [self-hosted, sin-lineamientos]
    needs: build
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

    steps:
      - name: Create Docker Network
        run: |
          docker network create --driver bridge --opt com.docker.network.driver.mtu=1400 maestria-network || echo "Network already exists"

      - name: Ensure Eureka Discovery Server is Running (directory)
        run: |
          if [ -z "$(docker ps -a -q -f name=directory-service)" ]; then
            echo "Creating and starting directory-service container..."
            docker run -d \
              --name "directory-service" \
              --network "maestria-network" \
              --network-alias "directory" \
              -p 8765:8761 \
              --restart "always" \
              --memory "256m" \
              --memory-swap "256m" \
              --label project="practica-u" \
              --label service="directory" \
              -e JAVA_TOOL_OPTIONS="-Dfile.encoding=UTF-8 -XX:+UseSerialGC -Xms64m -Xmx192m" \
              $DOCKER_USERNAME/practica-profesional-directory:latest
          else
            echo "directory-service container exists, ensuring it is started..."
            docker start directory-service
          fi

      - name: Ensure API Gateway Server is Running (gateway)
        run: |
          if [ -z "$(docker ps -a -q -f name=gateway-service)" ]; then
            echo "Creating and starting gateway-service container..."
            docker run -d \
              --name "gateway-service" \
              --network "maestria-network" \
              --network-alias "gateway" \
              -p 8081:8081 \
              --restart "always" \
              --memory "256m" \
              --memory-swap "256m" \
              --label project="practica-u" \
              --label service="gateway" \
              -e SPRING_PROFILES_ACTIVE="dev" \
              -e EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE="http://directory:8761/eureka/" \
              -e EUREKA_CLIENT_SERVICEURL_DEFAULTZONE="http://directory:8761/eureka/" \
              -e JWT_SECRET="mySecretKeyForTestingDeploymentOfPracticaU2026!!!" \
              -e JAVA_TOOL_OPTIONS="-Dfile.encoding=UTF-8 -XX:+UseSerialGC -Xms64m -Xmx192m" \
              $DOCKER_USERNAME/practica-profesional-gateway:latest
          else
            echo "gateway-service container exists, ensuring it is started..."
            docker start gateway-service
          fi

      - name: Infrastructure Diagnosis & Cleanup
        run: |
          echo "--- DISK SPACE CHECK ---"
          df -h || true
          echo "--- CLEANING OLD CONTAINER ---"
          docker rm -f frontend-sin-lineamientos-app || true

      - name: Pull Application Image (with Retry Logic)
        run: |
          echo "Attempting to pull image with auto-retry for stability..."
          for i in 1 2 3; do
            docker pull $DOCKER_USERNAME/practica-profesional-frontend-sin-lineamientos:latest && exit 0 || \
            (echo "Attempt $i failed, waiting 10s..." && sleep 10)
          done
          echo "All pull attempts failed."
          exit 1

      - name: Run Application Container
        run: |
          docker run -d \
            --name "frontend-sin-lineamientos-app" \
            --network "maestria-network" \
            --network-alias "frontend-sin-lineamientos" \
            -p 82:80 \
            --restart "always" \
            --memory "192m" \
            --memory-swap "192m" \
            --label project="practica-u" \
            --label service="sin-lineamientos" \
            -e API_URL="http://localhost:8081/api/" \
            -e GESTION_SOLICITUDES_API_URL="http://localhost:8081/ms-gestion-solicitudes/msmaestriac/" \
            -e GESTION_AUTENTICACION_API_URL="http://localhost:8096/api/auth/google" \
            -e GESTION_EXPERTOS_API_URL="http://localhost:8081/api/" \
            -e GESTION_EGRESADOS_API_URL="http://localhost:8081/api/" \
            -e GESTION_TRABAJO_GRADO_API_URL="http://localhost:8081/api/" \
            -e GESTION_DOCENTES_ESTUDIANTES_API_URL="http://localhost:8081/api/" \
            -e MATRICULA_ACADEMICA_API_URL="http://localhost:8081/matricula-academica/api/" \
            -e EVALUACION_DOCENTE_API_URL="http://localhost:8081/api/" \
            -e GESTION_MATRICULA_FINANCIERA_API_URL="http://localhost:8081/matricula-financiera/api/v1/gestion-matricula-financiera/" \
            -e GESTION_INFORMACION_PRESUPUESTARIA_API_URL="http://localhost:8081/informacion-presupuestaria/api/" \
            $DOCKER_USERNAME/practica-profesional-frontend-sin-lineamientos:latest

      - name: Clean Old Images of This Service
        run: |
          echo "Cleaning old images for frontend-sin-lineamientos service..."
          CURRENT_IMAGE=$(docker inspect frontend-sin-lineamientos-app --format='{{.Image}}' 2>/dev/null || echo "")
          if [ -n "$CURRENT_IMAGE" ]; then
            docker images --filter "label=service=sin-lineamientos" --format "{{.ID}}" | while read img; do
              if [ "$img" != "${CURRENT_IMAGE:7:12}" ]; then
                echo "Removing old image: $img"
                docker rmi -f $img 2>/dev/null || true
              fi
            done
          fi
          docker images $DOCKER_USERNAME/practica-profesional-frontend-sin-lineamientos --format "{{.ID}} {{.Tag}}" | grep -v "latest" | awk '{print $1}' | xargs -r docker rmi -f 2>/dev/null || true

      - name: Clean Stopped Containers of This Service
        run: |
          echo "Cleaning stopped containers for frontend-sin-lineamientos service..."
          docker ps -a --filter "label=service=sin-lineamientos" --filter "status=exited" -q | xargs -r docker rm 2>/dev/null || true

      - name: Final Status Check
        run: |
          sleep 5
          docker ps | grep frontend-sin-lineamientos-app || true
          echo "--- LAST 20 LINES OF LOGS ---"
          docker logs --tail 20 frontend-sin-lineamientos-app || true
