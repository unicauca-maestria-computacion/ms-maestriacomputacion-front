<div class="surface-0 p-4">
    <p-toast position="top-right"></p-toast>

    <!-- Navegación por pestañas -->
    <app-opciones-presupuesto
        [activeTab]="'proyeccion-reporte'"
        [currentPeriod]="periodoSeleccionado"
        (onDescargar)="descargar()">
    </app-opciones-presupuesto>

    <!-- Selector de Período -->
    <div class="flex justify-content-center mb-4">
        <app-periodo-financiero-selector
            [modo]="'activos'"
            [mensajeVacio]="'No hay períodos académicos activos para mostrar.'"
            (periodoSeleccionado)="onPeriodoChange($event)"
            (sinPeriodosChange)="sinPeriodos = $event"
            (errorCargaChange)="errorPeriodos = $event">
        </app-periodo-financiero-selector>
    </div>

    <!-- Estado: Cargando -->
    <div *ngIf="cargando" class="mb-4">
        <app-uni-progress-bar label="Cargando proyección de estudiantes..."></app-uni-progress-bar>
    </div>

    <!-- Estado: Sin datos -->
    <app-estado-vacio
        *ngIf="!configuracion && !sinPeriodos && !errorPeriodos && !cargando"
        icono="inbox"
        mensaje="Seleccione un período académico para cargar la proyección.">
    </app-estado-vacio>

    <!-- Contenido -->
    <ng-container *ngIf="configuracion">

        <!-- Sección: Configuración editable -->
        <!-- Sección: Configuración editable -->
        <div class="mb-3">
            <app-uni-card-header titulo="Configuración del Reporte" icono="settings" class="no-radius-bottom">
            </app-uni-card-header>
            <div class="config-panel">
                <div class="config-row">
                    <span class="p-float-label">
                        <p-inputNumber id="float-biblioteca"
                            *ngIf="editandoCabecera" [(ngModel)]="clonedCabecera.biblioteca"
                            mode="currency" currency="COP" locale="es-CO" [minFractionDigits]="0"
                            styleClass="config-input">
                        </p-inputNumber>
                        <p-inputNumber *ngIf="!editandoCabecera"
                            [ngModel]="configuracion.biblioteca"
                            mode="currency" currency="COP" locale="es-CO" [minFractionDigits]="0"
                            [readonly]="true" [disabled]="true" styleClass="config-input">
                        </p-inputNumber>
                        <label for="float-biblioteca">Biblioteca</label>
                    </span>

                    <span class="p-float-label">
                        <p-inputNumber id="float-recursos"
                            *ngIf="editandoCabecera" [(ngModel)]="clonedCabecera.recursosComputacionales"
                            mode="currency" currency="COP" locale="es-CO" [minFractionDigits]="0"
                            styleClass="config-input">
                        </p-inputNumber>
                        <p-inputNumber *ngIf="!editandoCabecera"
                            [ngModel]="configuracion.recursosComputacionales"
                            mode="currency" currency="COP" locale="es-CO" [minFractionDigits]="0"
                            [readonly]="true" [disabled]="true" styleClass="config-input">
                        </p-inputNumber>
                        <label for="float-recursos">Recursos Computacionales</label>
                    </span>

                    <span class="p-float-label">
                        <p-inputNumber id="float-smlv"
                            *ngIf="editandoCabecera" [(ngModel)]="clonedCabecera.valorSMLV"
                            mode="currency" currency="COP" locale="es-CO" [minFractionDigits]="0"
                            styleClass="config-input">
                        </p-inputNumber>
                        <p-inputNumber *ngIf="!editandoCabecera"
                            [ngModel]="configuracion.valorSMLV"
                            mode="currency" currency="COP" locale="es-CO" [minFractionDigits]="0"
                            [readonly]="true" [disabled]="true" styleClass="config-input">
                        </p-inputNumber>
                        <label for="float-smlv">Valor SMLV</label>
                    </span>

                    <div class="config-row-actions" *ngIf="esEditable">
                        <button *ngIf="!editandoCabecera" pButton pRipple type="button"
                            class="p-button-rounded p-button-text"
                            style="color: #000066; width:36px; height:36px; padding:0;"
                            pTooltip="Editar configuración" tooltipPosition="top"
                            aria-label="Editar configuración"
                            (click)="onHeaderEditInit()">
                            <span class="material-symbols-rounded" style="font-size:20px;" aria-hidden="true">edit</span>
                        </button>
                        <ng-container *ngIf="editandoCabecera">
                            <button pButton pRipple type="button"
                                class="p-button-rounded p-button-text"
                                style="color: #5BAE40; width:36px; height:36px; padding:0;"
                                pTooltip="Guardar" tooltipPosition="top"
                                aria-label="Guardar configuración"
                                (click)="onHeaderEditSave()">
                                <span class="material-symbols-rounded" style="font-size:20px;" aria-hidden="true">check_circle</span>
                            </button>
                            <button pButton pRipple type="button"
                                class="p-button-rounded p-button-text"
                                style="color: #FF6D0A; width:36px; height:36px; padding:0;"
                                pTooltip="Cancelar" tooltipPosition="top"
                                aria-label="Cancelar edición de configuración"
                                (click)="onHeaderEditCancel()">
                                <span class="material-symbols-rounded" style="font-size:20px;" aria-hidden="true">cancel</span>
                            </button>
                        </ng-container>
                    </div>
                </div>
            </div>
        </div>

        <!-- Título de sección institucional -->
        <div class="mb-2 px-1">
            <h2 class="text-xl font-semibold m-0" style="color: #000066; font-family: 'Titillium Web', sans-serif;">
                Proyección de Estudiantes
            </h2>
        </div>

        <app-tabla-estudiantes-reporte
            [estudiantes]="estudiantes"
            [configuracion]="configuracion"
            [editable]="true"
            [editingRowKey]="editingRowKey"
            (rowEditInit)="onRowEditInit($event)"
            (rowEditSave)="onRowEditSave($event)"
            (rowEditCancel)="onRowEditCancel($event.estudiante, $event.index)"
            (percentInput)="onPercentInput($event.event, $event.estudiante, $event.campo)">
        </app-tabla-estudiantes-reporte>

            <!-- Totales -->
            <div class="totales-container mt-3">
                <div class="total-item">
                    <span class="total-label">Total Neto:</span>
                    <span class="total-value">{{ totalNetoCalculado | formatCurrency }}</span>
                </div>
                <div class="total-item">
                    <span class="total-label">Total Descuentos:</span>
                    <span class="total-value">{{ totalDescuentosCalculado | formatCurrency }}</span>
                </div>
                <div class="total-item highlight">
                    <span class="total-label">Ingresos Totales Después de Descuentos:</span>
                    <span class="total-value">{{ totalIngresosCalculado | formatCurrency }}</span>
                </div>
            </div>
        
    </ng-container>
</div>
