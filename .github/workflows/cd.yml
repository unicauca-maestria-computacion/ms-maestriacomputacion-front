name: CD Practica Profesional ms-maestriacomputacion-front

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, lineamientos]
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

    steps:
      - name: Acquire exclusive deploy lock (avoid overwhelming the shared host)
        run: |
          LOCK_DIR="/tmp/practica-u-deploy.lock"
          MAX_WAIT=2400
          MAX_LOCK_AGE=1800
          waited=0
          while ! mkdir "$LOCK_DIR" 2>/dev/null; do
            lock_age=$(( $(date +%s) - $(stat -c %Y "$LOCK_DIR" 2>/dev/null || date +%s) ))
            if [ "$lock_age" -gt "$MAX_LOCK_AGE" ]; then
              echo "Lock abandonado hace ${lock_age}s (el dueno probablemente murio) -- liberando y tomando control"
              rm -rf "$LOCK_DIR"
              continue
            fi
            if [ "$waited" -ge "$MAX_WAIT" ]; then
              echo "Timeout esperando el lock de deploy compartido"
              exit 1
            fi
            echo "Otro deploy de practica-u esta en curso, esperando... (${waited}s/${MAX_WAIT}s)"
            sleep 10
            waited=$((waited + 10))
          done
          echo "${{ github.repository }}" > "$LOCK_DIR/owner"
          echo "Lock de deploy adquirido"

      - name: Create Docker Network
        run: |
          docker network create --driver bridge --opt com.docker.network.driver.mtu=1400 maestria-network || echo "Network already exists"

      - name: Ensure Eureka Discovery Server is Running (directory)
        run: |
          echo "Ensuring Eureka Discovery Server is running (retry up to 5 times)..."
          for attempt in 1 2 3 4 5; do
            if docker ps -q --filter name=directory-service; then
              echo "Eureka Discovery Server is already running (found on attempt $attempt)."
              break
            fi
            echo "Eureka not running, attempt $attempt/5..."
            if [ -z "$(docker ps -a -q -f name=directory-service)" ]; then
              echo "Creating directory-service container..."
              docker run -d \
                --name "directory-service" \
                --network "maestria-network" \
                --network-alias "directory" \
                -p 8765:8761 \
                --restart "always" \
                --cpus "0.5" \
                --memory "256m" \
                --memory-swap "256m" \
                --label project="practica-u" \
                --label service="directory" \
                -e JAVA_TOOL_OPTIONS="-Dfile.encoding=UTF-8 -XX:+UseSerialGC -Xms64m -Xmx192m" \
                $DOCKER_USERNAME/practica-profesional-directory:latest
            else
              echo "Starting existing directory-service container..."
              docker start directory-service 2>/dev/null || true
            fi
            if [ $attempt -lt 5 ]; then
              echo "Waiting 6s before next attempt..."
              sleep 6
            fi
          done
          if ! docker ps -q --filter name=directory-service; then
            echo "ERROR: Eureka Discovery Server failed to start after 5 attempts."
            exit 1
          fi
          echo "Eureka Discovery Server is ready."

      - name: Ensure API Gateway Server is Running (gateway)
        run: |
          if [ -z "$(docker ps -a -q -f name=gateway-service)" ]; then
            echo "Creating and starting gateway-service container..."
            docker run -d \
              --name "gateway-service" \
              --network "maestria-network" \
              --network-alias "gateway" \
              -p 8081:8081 \
              --restart "always" \
              --cpus "0.5" \
              --memory "256m" \
              --memory-swap "256m" \
              --label project="practica-u" \
              --label service="gateway" \
              -e SPRING_PROFILES_ACTIVE="dev" \
              -e EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE="http://directory:8761/eureka/" \
              -e EUREKA_CLIENT_SERVICEURL_DEFAULTZONE="http://directory:8761/eureka/" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e JAVA_TOOL_OPTIONS="-Dfile.encoding=UTF-8 -XX:+UseSerialGC -Xms64m -Xmx192m" \
              $DOCKER_USERNAME/practica-profesional-gateway:latest
          else
            echo "gateway-service container exists, ensuring it is started..."
            docker start gateway-service
          fi

      - name: Infrastructure Diagnosis & Cleanup
        run: |
          echo "--- DISK SPACE CHECK ---"
          df -h || true
          echo "--- CLEANING OLD CONTAINER ---"
          docker rm -f frontend-app || true

      - name: Pull Application Image (with Retry Logic)
        run: |
          echo "Attempting to pull image with auto-retry for stability..."
          for i in 1 2 3; do
            docker pull $DOCKER_USERNAME/practica-profesional-frontend:latest && exit 0 || \
            (echo "Attempt $i failed, waiting 10s..." && sleep 10)
          done
          echo "All pull attempts failed."
          exit 1

      - name: Run Application Container
        run: |
          docker run -d \
            --name "frontend-app" \
            --network "maestria-network" \
            --network-alias "frontend" \
            -p 81:80 \
            --restart "always" \
            --cpus "0.25" \
            --memory "64m" \
            --memory-swap "64m" \
            --label project="practica-u" \
            --label service="lineamientos" \
            -e API_URL="http://localhost:8081/api/" \
            -e GESTION_SOLICITUDES_API_URL="http://localhost:8081/ms-gestion-solicitudes/msmaestriac/" \
            -e GESTION_AUTENTICACION_API_URL="http://localhost:8096/api/auth/google" \
            -e GESTION_EXPERTOS_API_URL="http://localhost:8081/api/" \
            -e GESTION_EGRESADOS_API_URL="http://localhost:8081/api/" \
            -e GESTION_TRABAJO_GRADO_API_URL="http://localhost:8081/api/" \
            -e GESTION_DOCENTES_ESTUDIANTES_API_URL="http://localhost:8081/api/" \
            -e MATRICULA_ACADEMICA_API_URL="http://localhost:8081/matricula-academica/api/" \
            -e EVALUACION_DOCENTE_API_URL="http://localhost:8081/api/" \
            -e GESTION_MATRICULA_FINANCIERA_API_URL="http://localhost:8081/matricula-financiera/api/v1/gestion-matricula-financiera/" \
            -e GESTION_INFORMACION_PRESUPUESTARIA_API_URL="http://localhost:8081/informacion-presupuestaria/api/" \
            $DOCKER_USERNAME/practica-profesional-frontend:latest

      - name: Clean Old Images of This Service
        run: |
          echo "Cleaning old images for frontend-lineamientos service..."
          docker ps -a --filter "label=service=lineamientos" --filter "status=exited" -q | xargs -r docker rm 2>/dev/null || true
          echo 'Removing dangling images for this service...'
          docker images --filter 'dangling=true' --filter 'label=service=lineamientos' -q | xargs -r docker rmi -f 2>/dev/null || true
          CURRENT_IMAGE=$(docker inspect frontend-app --format='{{.Image}}' 2>/dev/null || echo "")
          if [ -n "$CURRENT_IMAGE" ]; then
            CURRENT_SHORT="${CURRENT_IMAGE:7:12}"
            docker images $DOCKER_USERNAME/practica-profesional-frontend --format "{{.ID}} {{.Tag}}" | while read img_id tag; do
              if [ "$tag" != "latest" ] && [ "${img_id:0:12}" != "$CURRENT_SHORT" ]; then
                echo "Removing old tagged image: $img_id ($tag)"
                docker rmi -f "$img_id" 2>/dev/null || true
              fi
            done
          fi

      - name: Clean Stopped Containers of This Service
        run: |
          echo "Cleaning stopped containers for frontend service..."
          docker ps -a --filter "label=service=lineamientos" --filter "status=exited" -q | xargs -r docker rm 2>/dev/null || true

      - name: Final Status Check
        run: |
          sleep 5
          docker ps | grep frontend-app || true
          echo "--- LAST 20 LINES OF LOGS ---"
          docker logs --tail 20 frontend-app || true

      - name: Release exclusive deploy lock
        if: always()
        run: |
          LOCK_DIR="/tmp/practica-u-deploy.lock"
          if [ -f "$LOCK_DIR/owner" ] && [ "$(cat "$LOCK_DIR/owner")" = "${{ github.repository }}" ]; then
            rm -rf "$LOCK_DIR"
          fi
