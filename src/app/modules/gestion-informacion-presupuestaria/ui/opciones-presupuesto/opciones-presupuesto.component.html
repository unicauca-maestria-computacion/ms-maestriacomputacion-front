<!-- Encabezado con Tabs y Botón Descargar — Design System TIC v3 -->
<div class="flex flex-column md:flex-row align-items-start md:align-items-center justify-content-between gap-3 mb-4 pb-3"
     style="border-bottom: 2px solid #DB141C;">

    <!-- Pestañas de navegación -->
    <div class="flex align-items-center gap-2 flex-wrap">
        <button *ngFor="let tab of tabOptions; trackBy: trackByTabOption"
            type="button"
            class="tab-btn"
            [class.tab-btn--active]="selectedTab === tab.value"
            (click)="onTabChange({ value: tab.value })"
            [attr.aria-current]="selectedTab === tab.value ? 'page' : null">
            {{ tab.label }}
        </button>
    </div>

    <!-- Botones de acción -->
    <div class="flex gap-2">
        <button *ngIf="activeTab === 'proyeccion-reporte'"
            pButton pRipple
            type="button"
            label="Proyectar Presupuesto"
            class="p-button-rounded p-button-outlined descargar-btn"
            pTooltip="Proyectar presupuesto para un nuevo período"
            tooltipPosition="left"
            (click)="proyectarPresupuesto()">
            <span class="material-symbols-rounded mr-2" aria-hidden="true" style="font-size: 18px;">add_circle</span>
        </button>
        <button
            pButton pRipple
            type="button"
            label="Descargar"
            class="p-button-rounded p-button-outlined descargar-btn"
            pTooltip="Descargar reporte en Excel"
            tooltipPosition="left"
            aria-label="Descargar reporte en Excel"
            (click)="descargar()">
            <span class="material-symbols-rounded mr-2" aria-hidden="true" style="font-size: 18px;">download</span>
        </button>
    </div>
</div>

<app-descargar-reporte-dialog
    [(display)]="displayDescargarModal"
    [reporteActual]="activeTab"
    [periodoActual]="currentPeriod">
</app-descargar-reporte-dialog>
