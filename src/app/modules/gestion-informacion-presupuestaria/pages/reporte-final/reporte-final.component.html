<div class="col-12">
    <p-card>
        <app-opciones-presupuesto
            [activeTab]="'reporte-final'"
            (onDescargar)="descargar()">
        </app-opciones-presupuesto>

        <!-- Selector de Periodo Académico -->
        <div class="flex justify-content-center align-items-center mb-4">
            <button
                pButton
                type="button"
                icon="pi pi-chevron-left"
                class="p-button-rounded p-button-text"
                (click)="irPeriodoAnterior()"
                [disabled]="!hayAnterior">
            </button>

            <div class="mx-3 text-center">
                <span class="periodo-academico-texto">Período Académico</span>
                <br>
                <span class="periodo-academico-valor">{{ periodoActualTexto }}</span>
            </div>

            <button
                pButton
                type="button"
                icon="pi pi-chevron-right"
                class="p-button-rounded p-button-text"
                (click)="irPeriodoSiguiente()"
                [disabled]="!haySiguiente">
            </button>
        </div>

        <!-- Contenido del Reporte -->
        <div class="table-container">
            <p>reporte-final works!</p>
        </div>
    </p-card>
</div>
