<div class="surface-0 p-4">

  <!-- Botón volver -->
  <p-button
    label="Volver al listado"
    icon="pi pi-arrow-left"
    styleClass="p-button-text p-button-rounded mb-3 btn-volver"
    aria-label="Volver al listado de matrículas financieras"
    (onClick)="volverAlListado()">
  </p-button>

  <ng-container *ngIf="vmDetalle$ | async as vm">

    <!-- Estado: Cargando -->
    <div *ngIf="vm.loading" class="uni-progress-bar" role="status" aria-label="Cargando detalle del estudiante">
      <div class="uni-progress-bar__track"></div>
    </div>

    <!-- Estado: Error -->
    <p-message
      *ngIf="vm.error && !vm.loading"
      severity="error"
      styleClass="uni-message w-full mb-3"
      text="No fue posible cargar el detalle del estudiante. Por favor, verifique su conexión e intente nuevamente.">
    </p-message>

    <!-- Estado: Vacío (404) -->
    <div *ngIf="vm.isEmpty && !vm.loading">
      <app-estado-vacio
        icono="person_off"
        mensaje="No se encontró información de matrícula para este estudiante en el período seleccionado.">
        <p-button
          label="Volver al listado"
          styleClass="p-button-rounded p-button-outlined btn-outlined-institucional"
          aria-label="Volver al listado de matrículas financieras"
          (onClick)="volverAlListado()">
        </p-button>
      </app-estado-vacio>
    </div>

    <!-- Estado: Datos -->
    <ng-container *ngIf="!vm.loading && !vm.isEmpty && vm.estudiante as est">

      <!-- Título -->
      <app-page-header [titulo]="est.nombre + ' ' + est.apellido">
        <app-periodo-badge
          *ngIf="vm.periodos?.length"
          [label]="getPeriodoLabel(vm.periodos)">
        </app-periodo-badge>
      </app-page-header>

      <!-- Distribución de datos del estudiante: secciones de Matrícula Financiera
           y Matrícula Académica (materias en tabla) -->
      <p-card styleClass="uni-card">
        <app-tabla-matricula-estudiante [estudiante]="est"></app-tabla-matricula-estudiante>
      </p-card>

    </ng-container>

    <!-- No banner-revision here as this is the coordinator view of another student's detail -->

  </ng-container>
</div>

<!-- Toast institucional -->
<p-toast position="top-right" styleClass="uni-toast"></p-toast>
