<div class="surface-0 p-4 border-round-xl min-h-screen">

  <ng-container *ngIf="vmResumen$ | async as vm">

    <!-- Encabezado unificado -->
    <app-page-header [titulo]="vm.estudiante ? (vm.estudiante.nombre + ' ' + vm.estudiante.apellido) : 'Mi Matrícula Financiera'">
      <app-periodo-badge
        *ngIf="vm.periodos?.length"
        [label]="getPeriodoLabel(vm.periodos)">
      </app-periodo-badge>
    </app-page-header>

    <!-- Estado: Cargando -->
    <div *ngIf="vm.loading" class="uni-progress-bar" role="status" aria-label="Cargando información de matrícula">
      <div class="uni-progress-bar__track"></div>
    </div>

    <!-- Estado: Error -->
    <p-message
      *ngIf="vm.error && !vm.loading"
      severity="error"
      styleClass="uni-message w-full mb-3"
      text="No fue posible cargar su información de matrícula. Si el error persiste, por favor solicite una revisión.">
    </p-message>

    <!-- Estado: Vacío (sin matrícula) -->
    <div *ngIf="vm.isEmpty && !vm.loading" class="mb-4 banner-info">
      <app-estado-vacio
        icono="info"
        mensaje="No se encontró información de matrícula para el período académico actual. Si considera que esto es un error, puede solicitar una revisión.">
      </app-estado-vacio>
    </div>

    <!-- Estado: Datos del estudiante -->
    <ng-container *ngIf="!vm.loading && !vm.isEmpty && vm.estudiante as est">

      <!-- Distribución de datos del estudiante: secciones de Matrícula Financiera
           y Matrícula Académica (materias en tabla) -->
      <p-card styleClass="uni-card">
        <app-tabla-matricula-estudiante [estudiante]="est"></app-tabla-matricula-estudiante>
      </p-card>

    </ng-container>

    <!-- Sección de revisión — SIEMPRE visible -->
    <div class="flex flex-column md:flex-row align-items-center justify-content-between gap-3 mt-3 p-3 banner-revision">
      <div class="flex align-items-center gap-3">
        <span class="material-symbols-rounded icon-revision" aria-hidden="true">info</span>
        <span class="texto-revision">
          Si tiene dudas sobre su costo de matrícula o no aparece su información, puede solicitar una revisión.
        </span>
      </div>
      <p-button
        label="Solicitar Revisión"
        icon="pi pi-send"
        styleClass="p-button-rounded btn-institucional flex-shrink-0"
        aria-label="Solicitar revisión de matrícula financiera"
        (onClick)="solicitarRevision()">
      </p-button>
    </div>

  </ng-container>
</div>

<!-- Toast institucional -->
<p-toast position="top-right" styleClass="uni-toast"></p-toast>
